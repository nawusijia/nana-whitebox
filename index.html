<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>娜娜白膜 · 站位预演</title>
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#1d1d1f; --mute:#6b6b70; --line:#e2e0da;
  --accent:#ff6a3d; --accent-soft:#fff0ea; --ok:#2f9e6b; --warn:#e8590c; --bad:#d6336c;
  --grid:#e9e7e1; --sel:#2b6cff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}
header{height:48px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.5px}
header h1 b{color:var(--accent)}
header .sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#bbb}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.small{padding:2px 8px;font-size:12px}
main{display:grid;grid-template-columns:240px 1fr 460px;grid-template-rows:1fr 230px;height:calc(100% - 48px)}
#left{grid-row:1/3;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px}
#plan{grid-column:2;grid-row:1;position:relative;overflow:hidden}
#plan canvas{position:absolute;inset:0;width:100%;height:100%;cursor:default}
#right{grid-column:3;grid-row:1;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
#shots{grid-column:2/4;border-top:1px solid var(--line);background:var(--panel);overflow:auto}
h3{font-size:12px;color:var(--mute);font-weight:600;margin:14px 0 6px;letter-spacing:.5px}
h3:first-child{margin-top:0}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.list .it{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer}
.list .it:hover{background:#f6f5f2}
.list .it.on{background:var(--accent-soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.props label{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:6px;margin:4px 0}
.props input,.props select{width:100%;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:#fff}
.props .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hint{color:var(--mute);font-size:12px}
#view3d{position:relative;aspect-ratio:16/9;background:#dcdad4;flex:none}
#view3d canvas{width:100%;height:100%;display:block}
#view3d .tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:1px 6px;font-size:12px}
#analysis{padding:10px 12px;overflow:auto;flex:1}
#analysis .say{background:#faf9f6;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;white-space:pre-wrap}
.warn{color:var(--warn)} .bad{color:var(--bad)} .ok{color:var(--ok)}
table{border-collapse:collapse;width:100%}
#shots th{position:sticky;top:0;background:#faf9f6;font-weight:600;color:var(--mute);font-size:12px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
#shots td{padding:4px 8px;border-bottom:1px solid #f0eee9;vertical-align:middle}
#shots tr.on td{background:var(--accent-soft)}
#shots input,#shots select{padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
#shots td.num{font-weight:700;width:42px;cursor:pointer}
.pill{display:inline-block;padding:0 6px;border-radius:10px;font-size:11px;background:#eee}
.pill.warn{background:#fff1e6;color:var(--warn)} .pill.bad{background:#ffe8ef;color:var(--bad)} .pill.ok{background:#e9f7f0;color:var(--ok)}
#player{position:fixed;inset:0;background:rgba(10,10,12,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:10}
#player canvas{width:min(92vw,1280px);aspect-ratio:16/9;background:#000;border-radius:6px}
#player .bar{display:flex;gap:8px;align-items:center;color:#ddd}
.toggle{display:flex;align-items:center;gap:6px;margin:6px 0}
.props label.toggle{display:flex}
.props label.toggle input{width:auto}
@media (max-width:1100px){main{grid-template-columns:200px 1fr 380px}}
</style>
</head>
<body>
<header>
  <h1>娜娜白膜 <b>·</b> 站位预演</h1>
  <span class="hint">摆人、摆家具、摆机位 → 自动算谁在左谁在右 → 拼成预演视频</span>
  <span class="sp"></span>
  <button class="btn" id="bSample">示例场景</button>
  <button class="btn" id="bNew">清空</button>
  <button class="btn" id="bLoad">打开…</button>
  <button class="btn" id="bSave">保存</button>
  <button class="btn primary" id="bPlay">▶ 播放预演</button>
  <input type="file" id="file" accept=".json" hidden>
</header>
<main>
  <section id="left">
    <h3>添加</h3>
    <div class="addrow">
      <button class="btn" data-add="person">＋ 人物</button>
      <button class="btn" data-add="camera">＋ 机位</button>
      <button class="btn" data-add="box">＋ 家具/墙</button>
      <button class="btn" data-add="shot">＋ 镜头</button>
    </div>
    <h3>场景里的东西</h3>
    <div class="list" id="list"></div>
    <h3>属性</h3>
    <div class="props" id="props"><span class="hint">在俯视图上点一个东西</span></div>
    <h3>怎么用</h3>
    <div class="hint">
      · 拖动人物、家具、机位改位置<br>
      · 拖人物身上的小圆点改朝向，拖机位前面的小圆点改它看向哪里<br>
      · 下方表格每一行是一个镜头：选机位、填台词<br>
      · 打开“只改这一镜的站位”后，拖人物只影响当前镜头和后面的镜头，用来做走位<br>
      · 右边是这个镜头拍到的白膜画面，和可以直接抄进提示词的站位文字
    </div>
  </section>
  <section id="plan"><canvas id="cPlan"></canvas></section>
  <section id="right">
    <div id="view3d"><canvas id="c3d"></canvas><span class="tag" id="tag3d">镜头</span></div>
    <div id="analysis"></div>
  </section>
  <section id="shots">
    <table>
      <thead><tr><th>镜号</th><th style="width:130px">机位</th><th style="width:70px">时长(秒)</th><th style="width:110px">谁说</th><th>台词</th><th style="width:150px">检查</th><th style="width:40px"></th></tr></thead>
      <tbody id="tShots"></tbody>
    </table>
  </section>
</main>
<div id="player">
  <canvas id="cPlay" width="1280" height="720"></canvas>
  <div class="bar">
    <span id="playInfo"></span>
    <label class="toggle"><input type="checkbox" id="optTTS" checked>朗读台词（浏览器自带语音）</label>
    <label class="toggle"><input type="checkbox" id="optRec">同时录成视频</label>
    <button class="btn small" id="bReplay">重播</button>
    <button class="btn small" id="bClose">关闭</button>
  </div>
</div>

<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* ---------------- 数据 ---------------- */
const COLORS = ['#ef4444','#3b82f6','#22c55e','#eab308','#a855f7','#ec4899','#14b8a6','#f97316'];
const uid = p => p + Math.random().toString(36).slice(2, 8);
const SAMPLE = () => ({
  name: '咖啡店 · 三人',
  room: { w: 10, d: 8 },
  boxes: [
    { id: uid('b'), name: '吧台', x: 0, z: -2.4, w: 4.2, d: 0.7, h: 1.1, rot: 0 },
    { id: uid('b'), name: '后墙酒柜', x: 0, z: -3.8, w: 6, d: 0.4, h: 2.2, rot: 0 },
    { id: uid('b'), name: '圆桌', x: -2.6, z: 0.8, w: 0.9, d: 0.9, h: 0.75, rot: 0 },
    { id: uid('b'), name: '圆桌', x: 2.4, z: 1.2, w: 0.9, d: 0.9, h: 0.75, rot: 0 },
    { id: uid('b'), name: '柱子', x: -3.2, z: -1.4, w: 0.4, d: 0.4, h: 3, rot: 0 },
  ],
  people: [
    { id: uid('p'), name: '店员', color: COLORS[0], x: 0, z: -3.0, face: 180, sit: false },
    { id: uid('p'), name: '女主', color: COLORS[1], x: -0.7, z: -1.7, face: 20, sit: false },
    { id: uid('p'), name: '男主', color: COLORS[2], x: 0.7, z: -1.6, face: -40, sit: false },
  ],
  cameras: [
    { id: uid('c'), name: '全景', x: 0, z: 3.4, h: 1.6, tx: 0, tz: -2.2, th: 1.2, lens: 28 },
    { id: uid('c'), name: '过女主拍男主', x: -1.7, z: -0.4, h: 1.5, tx: 0.7, tz: -1.7, th: 1.5, lens: 40 },
    { id: uid('c'), name: '男主反打', x: 1.8, z: -0.3, h: 1.5, tx: -0.7, tz: -1.8, th: 1.5, lens: 40 },
  ],
  shots: [],
});
function sampleShots(s) {
  const [c0, c1, c2] = s.cameras, [p0, p1, p2] = s.people;
  s.shots = [
    { id: uid('s'), cam: c0.id, dur: 3, speaker: '', line: '', moves: {} },
    { id: uid('s'), cam: c1.id, dur: 3, speaker: p2.id, line: '你今天怎么来这么早？', moves: {} },
    { id: uid('s'), cam: c2.id, dur: 2, speaker: p1.id, line: '因为我想先帮你点好那杯不加糖的美式。', moves: {} },
    { id: uid('s'), cam: c0.id, dur: 3, speaker: p0.id, line: '两位，咖啡好了。', moves: { [p0.id]: { x: -0.2, z: -2.95, face: 180 } } },
  ];
  return s;
}
let S;
try { S = JSON.parse(localStorage.getItem('nana-whitebox')) } catch (e) { S = null }
if (!S || !S.room) S = sampleShots(SAMPLE());
let sel = null;          // {kind, id}
let curShot = S.shots[0]?.id || null;
let perShot = false;     // 只改这一镜的站位
const save = () => { try { localStorage.setItem('nana-whitebox', JSON.stringify(S)) } catch (e) {} };

/* 某个镜头时，人物的位置 = 基础位置 + 这一镜及之前所有镜头的走位 */
function peopleAt(shotId) {
  const st = Object.fromEntries(S.people.map(p => [p.id, { ...p }]));
  for (const sh of S.shots) {
    for (const [pid, m] of Object.entries(sh.moves || {})) if (st[pid]) Object.assign(st[pid], m);
    if (sh.id === shotId) break;
  }
  return st;
}
const camOf = sh => S.cameras.find(c => c.id === sh?.cam);
const shotIndex = id => S.shots.findIndex(s => s.id === id);

/* ---------------- 俯视图 ---------------- */
const cPlan = document.getElementById('cPlan'), g = cPlan.getContext('2d');
let view = { s: 60, ox: 0, oy: 0 };
function fitPlan() {
  const r = cPlan.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cPlan.width = r.width * dpr; cPlan.height = r.height * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  view.s = Math.min(r.width / (S.room.w + 1.5), r.height / (S.room.d + 1.5));
  view.ox = r.width / 2; view.oy = r.height / 2;
  drawPlan();
}
const W2P = (x, z) => [view.ox + x * view.s, view.oy + z * view.s];
const P2W = (px, py) => [(px - view.ox) / view.s, (py - view.oy) / view.s];
const faceVec = a => [Math.sin(a * Math.PI / 180), -Math.cos(a * Math.PI / 180)];
const hfov = lens => 2 * Math.atan(18 / lens);
function drawPlan() {
  const r = cPlan.getBoundingClientRect();
  g.clearRect(0, 0, r.width, r.height);
  // 房间和网格
  const [x0, y0] = W2P(-S.room.w / 2, -S.room.d / 2), [x1, y1] = W2P(S.room.w / 2, S.room.d / 2);
  g.fillStyle = '#fbfaf7'; g.fillRect(x0, y0, x1 - x0, y1 - y0);
  g.strokeStyle = getCss('--grid'); g.lineWidth = 1;
  for (let x = Math.ceil(-S.room.w / 2); x <= S.room.w / 2; x++) { const [a] = W2P(x, 0); g.beginPath(); g.moveTo(a, y0); g.lineTo(a, y1); g.stroke() }
  for (let z = Math.ceil(-S.room.d / 2); z <= S.room.d / 2; z++) { const [, b] = W2P(0, z); g.beginPath(); g.moveTo(x0, b); g.lineTo(x1, b); g.stroke() }
  g.strokeStyle = '#cfccc4'; g.strokeRect(x0, y0, x1 - x0, y1 - y0);
  g.fillStyle = '#a8a59d'; g.font = '11px sans-serif'; g.fillText('1 格 = 1 米', x0 + 4, y1 - 6);
  const sh = S.shots.find(s => s.id === curShot), st = peopleAt(curShot);
  // 机位视野
  for (const c of S.cameras) {
    const on = sh && sh.cam === c.id;
    const ang = Math.atan2(c.tz - c.z, c.tx - c.x), hf = hfov(c.lens) / 2, R = 30;
    const [px, py] = W2P(c.x, c.z);
    if (on) {
      g.fillStyle = 'rgba(255,106,61,.10)'; g.beginPath(); g.moveTo(px, py);
      g.arc(px, py, R * view.s, ang - hf, ang + hf); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(255,106,61,.55)'; g.beginPath(); g.moveTo(px, py); g.lineTo(px + Math.cos(ang - hf) * R * view.s, py + Math.sin(ang - hf) * R * view.s);
      g.moveTo(px, py); g.lineTo(px + Math.cos(ang + hf) * R * view.s, py + Math.sin(ang + hf) * R * view.s); g.stroke();
    }
  }
  g.save(); g.beginPath(); g.rect(x0 - 40, y0 - 40, x1 - x0 + 80, y1 - y0 + 80); g.clip();
  // 家具
  for (const b of S.boxes) {
    const [px, py] = W2P(b.x, b.z);
    g.save(); g.translate(px, py); g.rotate(b.rot * Math.PI / 180);
    g.fillStyle = isSel('box', b.id) ? '#c9d8ff' : '#d9d6ce'; g.strokeStyle = isSel('box', b.id) ? getCss('--sel') : '#aaa69c';
    g.fillRect(-b.w / 2 * view.s, -b.d / 2 * view.s, b.w * view.s, b.d * view.s); g.strokeRect(-b.w / 2 * view.s, -b.d / 2 * view.s, b.w * view.s, b.d * view.s);
    g.fillStyle = '#56534c'; g.font = '11px sans-serif'; g.textAlign = 'center'; g.fillText(b.name, 0, 4); g.restore();
  }
  // 人物
  for (const p0 of S.people) {
    const p = st[p0.id], [px, py] = W2P(p.x, p.z), rr = 0.26 * view.s, [fx, fz] = faceVec(p.face);
    g.fillStyle = p.color; g.beginPath(); g.arc(px, py, rr, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(px, py, rr, Math.atan2(fz, fx) - .8, Math.atan2(fz, fx) + .8); g.lineTo(px, py); g.fill();
    if (isSel('person', p.id)) { g.strokeStyle = getCss('--sel'); g.lineWidth = 2; g.beginPath(); g.arc(px, py, rr + 4, 0, Math.PI * 2); g.stroke(); g.lineWidth = 1 }
    const hx = px + fx * (rr + 14), hy = py + fz * (rr + 14);
    g.strokeStyle = p.color; g.beginPath(); g.moveTo(px, py); g.lineTo(hx, hy); g.stroke();
    g.fillStyle = '#fff'; g.strokeStyle = p.color; g.beginPath(); g.arc(hx, hy, 5, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = '#222'; g.font = 'bold 12px sans-serif'; g.textAlign = 'center'; g.fillText(p.name + (p.sit ? '（坐）' : ''), px, py + rr + 16);
  }
  // 机位
  for (const c of S.cameras) {
    const on = sh && sh.cam === c.id, [px, py] = W2P(c.x, c.z), [tx, ty] = W2P(c.tx, c.tz), ang = Math.atan2(ty - py, tx - px);
    g.save(); g.translate(px, py); g.rotate(ang);
    g.fillStyle = on ? getCss('--accent') : '#3a3a3c'; g.beginPath(); g.moveTo(14, 0); g.lineTo(-10, -9); g.lineTo(-10, 9); g.closePath(); g.fill();
    if (isSel('camera', c.id)) { g.strokeStyle = getCss('--sel'); g.lineWidth = 2; g.stroke(); g.lineWidth = 1 }
    g.restore();
    g.setLineDash([4, 4]); g.strokeStyle = on ? getCss('--accent') : '#999'; g.beginPath(); g.moveTo(px, py); g.lineTo(tx, ty); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#fff'; g.beginPath(); g.arc(tx, ty, 5, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = on ? getCss('--accent') : '#3a3a3c'; g.font = '11px sans-serif'; g.textAlign = 'center'; g.fillText(`${c.name} ${c.lens}mm`, px, py - 14);
  }
  g.restore();
}
const getCss = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const isSel = (k, id) => sel && sel.kind === k && sel.id === id;

/* 拖动 */
let drag = null;
cPlan.addEventListener('pointerdown', e => {
  const r = cPlan.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, st = peopleAt(curShot);
  const near = (x, z, rad) => { const [px, py] = W2P(x, z); return Math.hypot(px - mx, py - my) <= rad };
  let hit = null;
  for (const c of S.cameras) if (near(c.tx, c.tz, 8)) hit = { kind: 'camera', id: c.id, part: 'target' };
  if (!hit) for (const p0 of S.people) { const p = st[p0.id], [fx, fz] = faceVec(p.face), rr = 0.26 * view.s; const [px, py] = W2P(p.x, p.z); if (Math.hypot(px + fx * (rr + 14) - mx, py + fz * (rr + 14) - my) < 8) hit = { kind: 'person', id: p.id, part: 'face' } }
  if (!hit) for (const c of S.cameras) if (near(c.x, c.z, 14)) hit = { kind: 'camera', id: c.id, part: 'body' };
  if (!hit) for (const p0 of S.people) { const p = st[p0.id]; if (near(p.x, p.z, 0.3 * view.s)) hit = { kind: 'person', id: p.id, part: 'body' } }
  if (!hit) for (const b of [...S.boxes].reverse()) {
    const [wx, wz] = P2W(mx, my), a = -b.rot * Math.PI / 180, dx = wx - b.x, dz = wz - b.z;
    const lx = dx * Math.cos(a) - dz * Math.sin(a), lz = dx * Math.sin(a) + dz * Math.cos(a);
    if (Math.abs(lx) <= b.w / 2 && Math.abs(lz) <= b.d / 2) { hit = { kind: 'box', id: b.id, part: 'body' }; break }
  }
  if (hit) { sel = { kind: hit.kind, id: hit.id }; const [wx, wz] = P2W(mx, my); drag = { ...hit, sx: wx, sz: wz }; cPlan.setPointerCapture(e.pointerId) }
  else sel = null;
  refresh();
});
cPlan.addEventListener('pointermove', e => {
  if (!drag) return;
  const r = cPlan.getBoundingClientRect(); let [wx, wz] = P2W(e.clientX - r.left, e.clientY - r.top);
  const snap = v => e.shiftKey ? v : Math.round(v * 20) / 20;
  wx = snap(wx); wz = snap(wz);
  if (drag.kind === 'box') { const b = S.boxes.find(o => o.id === drag.id); b.x = wx; b.z = wz }
  if (drag.kind === 'camera') { const c = S.cameras.find(o => o.id === drag.id); if (drag.part === 'target') { c.tx = wx; c.tz = wz } else { const dx = wx - c.x, dz = wz - c.z; c.x = wx; c.z = wz; c.tx += dx; c.tz += dz } }
  if (drag.kind === 'person') {
    const base = S.people.find(o => o.id === drag.id), cur = peopleAt(curShot)[drag.id];
    let patch;
    if (drag.part === 'face') { patch = { face: Math.round(Math.atan2(wx - cur.x, -(wz - cur.z)) * 180 / Math.PI) } }
    else patch = { x: wx, z: wz };
    if (perShot && curShot) { const sh = S.shots.find(s => s.id === curShot); sh.moves[drag.id] = { ...(sh.moves[drag.id] || { x: cur.x, z: cur.z, face: cur.face }), ...patch } }
    else Object.assign(base, patch);
  }
  refresh(true);
});
cPlan.addEventListener('pointerup', () => { if (drag) { drag = null; save(); refresh() } });

/* ---------------- 3D 白膜 ---------------- */
const c3d = document.getElementById('c3d');
const R3 = new THREE.WebGLRenderer({ canvas: c3d, antialias: true, preserveDrawingBuffer: true });
R3.setPixelRatio(Math.min(2, devicePixelRatio || 1));
const scene = new THREE.Scene(); scene.background = new THREE.Color('#d9d7d1');
scene.add(new THREE.HemisphereLight(0xffffff, 0x9a968c, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(4, 8, 5); scene.add(sun);
const cam3 = new THREE.PerspectiveCamera(30, 16 / 9, 0.05, 200);
const world = new THREE.Group(); scene.add(world);
const matWhite = new THREE.MeshLambertMaterial({ color: 0xf2f1ec });
const matBox = new THREE.MeshLambertMaterial({ color: 0xc9c6bd });
const matFloor = new THREE.MeshLambertMaterial({ color: 0xbfbbb1 });
function buildWorld(shotId) {
  world.clear();

    const w = pg.measureText(txt).width + 40; pg.fillStyle = 'rgba(0,0,0,.6)'; pg.fillRect(640 - w / 2, 640, w, 50);
    pg.fillStyle = '#fff'; pg.fillText(txt, 640, 676);
  }
  pg.fillStyle = 'rgba(255,255,255,.25)'; pg.fillRect(0, 714, 1280, 6); pg.fillStyle = '#ff6a3d'; pg.fillRect(0, 714, 1280 * t, 6);
}
async function play() {
  const token = ++playing; player.style.display = 'flex';
  const imgs = []; for (const sh of S.shots) imgs.push(await frameOf(sh.id));
  const useTTS = document.getElementById('optTTS').checked && 'speechSynthesis' in window;
  let rec, chunks = [];
  if (document.getElementById('optRec').checked && cp.captureStream) {
    rec = new MediaRecorder(cp.captureStream(30), { mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm' });
    rec.ondataavailable = e => chunks.push(e.data); rec.start();
  }
  const total = S.shots.reduce((a, s) => a + Math.max(s.dur, speechSec(s.line)), 0); let done = 0;
  for (let i = 0; i < S.shots.length && token === playing; i++) {
    const sh = S.shots[i], need = speechSec(sh.line), over = need > sh.dur + 0.05, len = Math.max(sh.dur, need);
    document.getElementById('playInfo').textContent = `S${i + 1} / ${S.shots.length}`;
    let spoken = !useTTS || !sh.line;
    if (!spoken) { const u = new SpeechSynthesisUtterance(sh.line); u.lang = 'zh-CN'; u.rate = 1.05; u.onend = u.onerror = () => spoken = true; speechSynthesis.cancel(); speechSynthesis.speak(u); setTimeout(() => spoken = true, (need + 2) * 1000) }
    const t0 = performance.now();
    await new Promise(res => { const tick = () => { if (token !== playing) return res(); const el = (performance.now() - t0) / 1000; drawFrame(imgs[i], i, sh, Math.min(1, (done + Math.min(el, len)) / total), need, over); if (el >= len && spoken) return res(); requestAnimationFrame(tick) }; tick() });
    done += len;
  }
  if (rec) { rec.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = (S.name || '预演') + '.webm'; a.click() }; rec.stop() }
  document.getElementById('playInfo').textContent = '播放完了';
}
document.getElementById('bPlay').onclick = () => { if (!S.shots.length) return alert('先加几个镜头'); play() };
document.getElementById('bReplay').onclick = () => play();
document.getElementById('bClose').onclick = () => { playing++; speechSynthesis?.cancel(); player.style.display = 'none' };

addEventListener('resize', () => { fitPlan(); refresh() });
fitPlan(); refresh();
window.__S = () => S;
</script>
